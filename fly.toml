app = "kotisivukamu-pg-observer"
primary_region = "arn"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[deploy]
  strategy = "immediate"

[env]
  PORT = "8400"

[http_service]
  internal_port = 8400
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[restart]]
  policy = "always"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
